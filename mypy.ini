[mypy]
explicit_package_bases = True
mypy_path = packages/mazegen/src
exclude = (?x)(
    ^\.venv/
    | ^\.build/
    | ^build/
    | ^dist/
    | ^packages/mazegen/build/
    | ^packages/maze_analyzer\.py$
    )

# MiniLibX's bundled Python wheel does not publish PEP 561 type information.
[mypy-mlx]
ignore_missing_imports = True
